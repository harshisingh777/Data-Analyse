[project]
name = "datalens"
version = "2.0.0"
description = "Analytics and AutoML workbench: data profiling, statistical testing, model comparison and SQL for tabular data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Harshi Singh" }]
dependencies = [
    "flask>=3.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "jinja2>=3.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4"]

[project.scripts]
datalens = "datalens.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["datalens*"]

[tool.setuptools.package-data]
datalens = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning", "ignore::pytest.PytestConfigWarning"]

[tool.coverage.run]
source = ["datalens"]
omit = ["datalens/__main__.py"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM108"]
